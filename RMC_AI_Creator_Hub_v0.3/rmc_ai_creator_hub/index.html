function applyLanguage(){
 document.documentElement.lang=lang;

 document.querySelectorAll(".nav button").forEach(b=>{
   const key=b.dataset.page;
   const s=b.querySelector("span"); if(s) s.textContent=t(key==="home"?"home":key);
 });
 const more=document.querySelector(".nav small"); if(more) more.textContent=t("more");
}

   <p>${t("toneDesc")}</p>
   <div class="setting-row"><label>${t("tone")}<small>${t("toneDesc")}</small></label>
    <select id="toneSelect" class="control" onchange="settings.tone=this.value"><option value="creative">${t("creative")}</option><option value="professional">${t("professional")}</option><option value="concise">${t("concise")}</option></select></div>
   <div class="setting-row"><label>${t("history")}<small>${t("historyDesc")}</small></label><input id="history" class="toggle" type="checkbox" onchange="settings.history=this.checked"></div>
  </div>
  <div class="setting-card"><h3>👤 ${t("account")}</h3>
   <p>${t("accountDesc")}</p>
   <div class="setting-row"><label>${t("username")}<small>${t("usernameDesc")}</small></label><input id="username" class="control" value="${(settings.username||"").replace(/"/g,"&quot;")}"></div>
   <div class="setting-row"><label>${t("privacy")}<small>${t("privacyDesc")}</small></label><span class="chip">Local prototype</span></div>
   <button class="btn" style="margin-top:12px" onclick="saveSettings()">✓ ${t("save")}</button>
   <button class="close danger" style="margin-top:12px;margin-left:7px" onclick="resetSettings()">↻ ${t("reset")}</button>
   <div class="settings-note">${t("dangerText")} <button class="close danger" onclick="clearHistory()" style="float:right">${t("clear")}</button></div>
  </div>
 </div>`;
 $("#tools").innerHTML="";
 $("#langSelect").value=lang; $("#startupSelect").value=settings.startup; $("#notif").checked=settings.notifications;
 $("#auto").checked=settings.autosave; $("#themeSelect").value=settings.theme; $("#compact").checked=settings.compact;
 $("#toneSelect").value=settings.tone; $("#history").checked=settings.history;
 applyTheme(); applyCompact();
}
function renderPage(page,specific){
 if(page==="settings"){renderSettings();return}
 const cat=categories.find(c=>c[0]===page)||categories[0];
 $("#crumb").textContent=lang==="ar"?t(page):cat[2];
 const list=suggestions[page]||suggestions.chat;
 $("#cards").innerHTML=list.map((s,i)=>`
   <div class="card suggestion" onclick="openTool('${s[2]}','${s[0].replace(/'/g,"\\'")}')">
     <div class="ico">${i===0?"✦":icons[s[2]]||"✦"}</div>
     <h3>${lang==="ar"?arabicSuggestion(s[0]):s[0]}</h3>
     <p>${lang==="ar"?arabicSuggestion(s[1]):s[1]}</p>
     <div class="suggest-action">${t("tryIt")}</div>
   </div>`).join("");
 $("#tools").innerHTML=tools.filter(tl=>tl[2]===page||page==="chat").slice(0,8).map(tl=>`
   <div class="tool" onclick="openTool('${tl[2]}','${tl[0]}')">
     <div class="mini">${icons[tl[2]]||"✦"}</div>
     <div><strong>${tl[0]}</strong><span>${tl[1]}</span></div>
   </div>`).join("");
 if(!$("#tools").innerHTML) $("#tools").innerHTML=`<div class="tool" style="grid-column:1/-1"><div class="mini">✦</div><div><strong>More tools are coming</strong><span>We're building this section to become much bigger.</span></div></div>`;
 applyLanguage();
}
function arabicSuggestion(s){
 const map={
 "🔥 Generate 10 Video Titles":"🔥 ولّد 10 عناوين للفيديو",
 "📝 Improve My Title":"📝 حسّن عنوان الفيديو",
 "📄 YouTube Description":"📄 وصف يوتيوب جاهز",
 "#️⃣ Hashtags":"#️⃣ هاشتاغات مناسبة",
 "📈 Video Growth Ideas":"📈 أفكار لزيادة المشاهدات",
 "💡 Give Me Ideas":"💡 أعطني أفكارًا جديدة",
 "🎮 Gaming Ideas":"🎮 أفكار محتوى ألعاب",
 "📦 Unboxing Ideas":"📦 أفكار فتح صناديق",
 "⚡ Shorts Ideas":"⚡ أفكار للشورتس",
 "🔥 Trending Concepts":"🔥 أفكار عصرية للمحتوى"
 };
 return map[s]||s;
}
function changeLanguage(v){lang=v;localStorage.setItem("rmc_lang",lang);applyLanguage();renderSettings()}
function saveSettings(){
 settings.username=$("#username").value.trim()||"RMC Creator";
 localStorage.setItem("rmc_settings",JSON.stringify(settings)); applyLanguage();
 const b=document.querySelector(".setting-card .btn"); if(b){b.innerHTML="✓ "+t("saved");setTimeout(()=>b.innerHTML="✓ "+t("save"),900)}
}
function resetSettings(){localStorage.removeItem("rmc_settings");location.reload()}
function clearHistory(){localStorage.removeItem("rmc_history");alert(lang==="ar"?"تم مسح السجل المحلي.":"Local history cleared.")}
function applyTheme(){document.body.dataset.theme=settings.theme}
function applyCompact(){document.body.classList.toggle("compact",!!settings.compact)}
function openTool(page,specific){
 renderPage(page,specific);
 if(!specific){
   $("#mtitle").textContent=categories.find(c=>c[0]===page)?.[2]||"AI Tool";
   $("#mbody").innerHTML=`
   <div class="field"><label>Tell RMC what you want</label>
   <textarea id="idea" placeholder="Write your idea here..."></textarea></div>
   <div class="chips"><span class="chip">Arabic</span><span class="chip">English</span><span class="chip">Creative</span><span class="chip">Professional</span></div>
   <button class="btn" style="margin-top:15px" onclick="generate('${page}')">Generate ✦</button>
   <div class="output" id="out">Your generated result will appear here.</div>`;
   $("#modal").classList.add("show");
 } else {
   $("#mtitle").textContent=specific;
   $("#mbody").innerHTML=`
   <div class="field"><label>Your idea</label>
   <textarea id="idea" placeholder="Example: I want to make a video about..."></textarea></div>
   <div class="chips"><span class="chip">Arabic</span><span class="chip">English</span><span class="chip">Creative</span><span class="chip">Professional</span></div>
   <button class="btn" style="margin-top:15px" onclick="generate('${page}')">Generate ✦</button>
   <div class="output" id="out">Tell me your idea and I'll build the first draft.</div>`;
   $("#modal").classList.add("show");
 }
}

function generate(page){
 const x=$("#idea").value.trim()||"a new creator project";
 const templates={
 youtube:`TITLE OPTIONS\n1. ${x} — You Won't Believe What Happened!\n2. I Tried ${x}... Here's What Happened\n3. ${x} | The Start of Something BIG\n\nDESCRIPTION\nToday I'm testing ${x}. Watch until the end for the result.\n\nCTA\nSubscribe for the next episode and tell me what I should try next.`,
 content:`IDEA 1 — Challenge: ${x} with a surprising twist.\nIDEA 2 — Behind the scenes: how ${x} actually works.\nIDEA 3 — Beginner vs Pro: compare both approaches.\nIDEA 4 — 30-day experiment built around ${x}.\nIDEA 5 — The mistake everyone makes with ${x}.`,
 script:`HOOK (0–5s)\n"What if ${x} turns out completely different than expected?"\n\nSETUP\nQuickly explain the goal and why viewers should care.\n\nMAIN\nBuild the story in 3 escalating moments. Add a payoff before the ending.\n\nENDING\nReveal the result, then tease the next video.`,
 thumb:`THUMBNAIL CONCEPT\nMain subject: ${x}\nComposition: subject large on one side, clear focal point, dark background.\nText: 2–4 powerful words, maximum readability.\nStyle: realistic, clean, blue/black cinematic lighting, no clutter.\n\nTEXT OPTIONS: "I DID IT" · "WHAT?!" · "FINALLY"`,
 image:`IMAGE PROMPT\nCreate a high-quality cinematic visual based on: ${x}.\nUse realistic lighting, strong composition, deep blue/black accents, detailed subject, clean background, professional creator aesthetic.`,
 video:`VIDEO PLAN\n0–3s: strongest hook for ${x}\n3–8s: establish the situation\n8–20s: fastest/highest-value moments\n20–27s: payoff or reveal\n27–30s: short CTA\n\nEDITING: quick cuts, readable captions, remove dead air.`,
 audio:`VOICE-OVER\n"Today we're talking about ${x}. Let's get straight into it. First, here's what matters... [main point]. And here's the part you probably didn't expect... [payoff]."`,
 chat:`AI BRAINSTORM\nI’d approach "${x}" from three angles: audience value, uniqueness, and monetization.\n\nNEXT MOVE\nTurn the strongest angle into a small test before spending money building the full version.`,
 seo:`SEO PACK\nPrimary topic: ${x}\nSearch intent: informational + discovery\nTitle keyword direction: ${x} for beginners\nDescription keywords: ${x}, guide, tips, tutorial, best, 2026\n\nHashtags: #${x.replace(/[^a-zA-Z0-9]+/g,"").toLowerCase()} #creator #gaming #youtube`,
 productivity:`PROJECT ROADMAP\n1. Define the exact result for: ${x}\n2. Build the smallest usable version.\n3. Test it with 3–5 people.\n4. Fix the biggest problem.\n5. Publish a public version.\n6. Measure clicks, usage and retention.\n7. Improve based on evidence.`,
 learn:`LEARNING PATH — ${x}\nLevel 1: understand the basics.\nLevel 2: copy a small real project.\nLevel 3: build your own version.\nLevel 4: fix weaknesses through feedback.\nLevel 5: publish the result as a portfolio project.`
 };
 const result=templates[page]||templates.chat;
 $("#out").textContent=result;
 if(settings.history){
   const hist=JSON.parse(localStorage.getItem("rmc_history")||"[]");
   hist.unshift({page,idea:x,result,time:new Date().toISOString()});
   localStorage.setItem("rmc_history",JSON.stringify(hist.slice(0,50)));
 }
}
function closeModal(){$("#modal").classList.remove("show")}
function quickGenerate(){openTool("content","AI Creator Idea Lab"); setTimeout(()=>{$("#idea").value=$("#quick").value||"a new creator project";generate("content")},50)}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 renderPage(b.dataset.page);
}));
applyLanguage();
renderPage(settings.startup||"content");
</script>
</body>
</html>
